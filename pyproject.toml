
[project]
name = "srszw"
version = "0.2.0"
description = "VOICEVOX 中文跨语种自动生成脚本 -- 术人术中文"
readme = "README.md"
requires-python = ">=3.12"
license = "WTFPL"
license-files = ["LICENSE"]
authors = [{ name = "hooay233" }]
keywords = ["voicevox", "tts", "chinese", "japanese", "cross-language"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = ["httpx>=0.28.1", "pypinyin>=0.48.0"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
srszw = "srszw.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["srszw*"]

[tool.setuptools.package-data]
srszw = ["data/**/*.json"]

[dependency-groups]
dev = ["pyright>=1.1.411", "pytest>=9.1.1", "ruff>=0.16.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
markers = ["integration: 需要真实 VOICEVOX Engine（通过 VVENGINE_URL 指定）的集成测试"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[project.urls]
Homepage = "https://github.com/hooay233/srszw"
